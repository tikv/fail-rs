[package]
name = "fail"
version = "0.6.0"
authors = ["The TiKV Project Developers"]
license = "Apache-2.0"
keywords = ["failpoints", "fail"]
repository = "https://github.com/tikv/fail-rs"
readme = "README.md"
homepage = "https://github.com/tikv/fail-rs"
documentation = "https://docs.rs/fail"
description = "Fail points for rust."
categories = ["development-tools::testing"]
edition = "2021"
exclude = ["/.github/*", "/.travis.yml", "/appveyor.yml"]

[dependencies]
log = { version = "0.4", features = ["std"] }
once_cell = "1.9.0"
rand = "0.8"

[features]
failpoints = []
# Automatically prefix fail point names with the name of the crate the fail point
# is currently located.
#
# This can be used to prevent conflicting fail points from two seperate libraries
# being triggered accidentally.
#
# WARNING:
# This feature should *NOT* be enabled outside of tests/dev-dependencies
# due to crate features being additive in nature.
crate-isolation = []

[package.metadata.docs.rs]
all-features = true
